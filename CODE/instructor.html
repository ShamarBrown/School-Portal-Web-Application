<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instructor Dashboard</title>

    <link rel="stylesheet" href="../ASSETS/instructor.css">
</head>

<body>

    <header>
        <h1>Instructor Dashboard</h1>
        <p>Manage student grades and academic performance</p>
    </header>

    <main>

        <!-- Subject Selection -->
        <section class="subject-section">

            <h2>Select Subject</h2>

            <label for="subjectSelect">Subject:</label>

            <select id="subjectSelect">
                <option value="">-- Select Subject --</option>
                <option value="Programming">Programming</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Computer Networks">Computer Networks</option>
            </select>

        </section>

        <!-- Grade Entry -->
        <section class="grade-section">

            <h2>Student Grade Entry</h2>

            <form id="gradeForm">

                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" required>

                <label for="studentId">Student ID:</label>
                <input type="text" id="studentId" required>

                <label for="coursework">Coursework Grade:</label>
                <input type="number" id="coursework" min="0" max="100" required>

                <label for="exam">Exam Grade:</label>
                <input type="number" id="exam" min="0" max="100" required>

                <button type="submit">Submit Grade</button>

            </form>

        </section>

        <!-- Academic Metrics -->
        <section class="metrics-section">

            <h2>Academic Performance</h2>

            <div class="metrics">

                <div class="metric-card">
                    <h3>Total Students</h3>
                    <p id="totalStudents">0</p>
                </div>

                <div class="metric-card">
                    <h3>Class Average</h3>
                    <p id="classAverage">0%</p>
                </div>

            </div>

        </section>

        <!-- Grade Records -->
        <section class="records-section">

            <h2>Student Grade Records</h2>

            <table>

                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Student ID</th>
                        <th>Coursework</th>
                        <th>Exam</th>
                        <th>Average</th>
                        <th>Grade</th>
                    </tr>
                </thead>

                <tbody id="gradeTable">
                </tbody>

            </table>

        </section>

    </main>

    <script src="../ASSETS/instructor.js"></script>

</body>
</html>
